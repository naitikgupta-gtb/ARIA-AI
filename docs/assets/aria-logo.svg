<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8fdff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#4dd8e6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4dd8e6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#4dd8e6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4dd8e6" stop-opacity="0.25"/>
    </radialGradient>

    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="tightGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220"/>
    </clipPath>
  </defs>

  <!-- Badge background (squircle, matches modern app-icon conventions) -->
  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="#4dd8e6" opacity="0.04"/>
  </g>
  <rect x="6" y="6" width="1012" height="1012" rx="216" ry="216"
        fill="none" stroke="#17233a" stroke-width="4"/>

  <!-- Outer halo -->
  <circle cx="512" cy="512" r="330" fill="url(#haloGlow)" filter="url(#softBlur)"/>

  <!-- Orbit rings -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#17233a" stroke-width="3"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#4dd8e6" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="90 620" opacity="0.85"
          transform="rotate(-40 512 512)"/>

  <circle cx="512" cy="512" r="250" fill="none" stroke="#4dd8e6" stroke-width="2" opacity="0.35"/>
  <circle cx="512" cy="512" r="250" fill="none" stroke="#4dd8e6" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="140 1430" opacity="0.6"
          transform="rotate(120 512 512)"/>

  <!-- Orbit node -->
  <circle cx="812" cy="512" r="14" fill="#b6faff" filter="url(#tightGlow)" transform="rotate(-40 512 512)"/>

  <!-- Core -->
  <circle cx="512" cy="512" r="150" fill="url(#coreGlow)"/>
  <circle cx="512" cy="512" r="86" fill="#05070c" stroke="#b6faff" stroke-width="6" filter="url(#tightGlow)"/>

  <!-- Stylised "A" mark, stroke-built for clean geometry -->
  <g stroke="#e8fdff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 512 458 L 476 566"/>
    <path d="M 512 458 L 548 566"/>
    <path d="M 490 526 L 534 526"/>
  </g>
</svg>
