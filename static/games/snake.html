<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARIA Games — Snake</title>
<style>
  :root{ --bg:#05070c; --cyan:#4dd8e6; --amber:#e6a94d; --text:#dce8f0; }
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--text);
        font-family:'Courier New', monospace; display:flex; flex-direction:column;
        align-items:center; padding:30px 16px; }
  h1{ letter-spacing:3px; color:var(--cyan); }
  #hud{ display:flex; gap:24px; margin-bottom:12px; font-size:15px; }
  canvas{ background:#0d1220; border:2px solid #1c2740; border-radius:8px; }
  .hint{ color:#7f93ab; font-size:13px; margin-top:12px; }
  a.back{ color:#7f93ab; margin-top:20px; text-decoration:none; }
  #overlay{ position:fixed; inset:0; background:rgba(0,0,0,.7); display:none;
            align-items:center; justify-content:center; flex-direction:column; }
  #overlay button{ margin-top:14px; padding:10px 22px; background:var(--cyan); border:none;
                    border-radius:8px; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>
  <h1>🐍 SNAKE</h1>
  <div id="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <p class="hint">Arrow keys or WASD to move. Space to pause.</p>
  <a class="back" href="index.html">← Games Hub</a>

  <div id="overlay">
    <div id="overlayMsg" style="font-size:22px;">Game Over</div>
    <button id="restartBtn">Restart</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const CELL = 20, COLS = canvas.width / CELL, ROWS = canvas.height / CELL;

let snake, dir, nextDir, food, score, best, running, paused, loopId;

function loadBest(){ return parseInt(localStorage.getItem('aria_snake_best') || '0', 10); }
function saveBest(v){ try { localStorage.setItem('aria_snake_best', v); } catch(e){} }

function reset(){
  snake = [{x:8,y:10},{x:7,y:10},{x:6,y:10}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  food = randFood();
  score = 0; best = loadBest();
  running = true; paused = false;
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  document.getElementById('overlay').style.display = 'none';
}

function randFood(){
  let p;
  do {
    p = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
  } while (snake && snake.some(s => s.x===p.x && s.y===p.y));
  return p;
}

function tick(){
  if (!running || paused) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x<0 || head.x>=COLS || head.y<0 || head.y>=ROWS || snake.some(s=>s.x===head.x && s.y===head.y)){
    running = false;
    if (score > best){ best = score; saveBest(best); }
    document.getElementById('overlayMsg').textContent = `Game Over — Score ${score}`;
    document.getElementById('overlay').style.display = 'flex';
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y){
    score += 10;
    document.getElementById('score').textContent = score;
    food = randFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw(){
  ctx.fillStyle = '#0d1220';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#e6a94d';
  ctx.fillRect(food.x*CELL, food.y*CELL, CELL-2, CELL-2);
  snake.forEach((s,i)=>{
    ctx.fillStyle = i===0 ? '#4dd8e6' : 'rgba(77,216,230,0.6)';
    ctx.fillRect(s.x*CELL, s.y*CELL, CELL-2, CELL-2);
  });
}

document.addEventListener('keydown', (e)=>{
  const map = {
    ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
    w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0},
  };
  if (e.key === ' '){ paused = !paused; return; }
  const nd = map[e.key];
  if (nd && !(nd.x === -dir.x && nd.y === -dir.y)) nextDir = nd;
});

document.getElementById('restartBtn').addEventListener('click', reset);

reset();
draw();
clearInterval(loopId);
loopId = setInterval(tick, 110);
</script>
</body>
</html>
